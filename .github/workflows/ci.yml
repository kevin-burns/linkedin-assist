name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26']
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Architecture gate
        run: make check-deps

      - name: Tests with race detector
        run: go test -race ./...

      - name: Build
        run: make build

  # The bundled skill scripts are Python, not Go, so the `test` job above never
  # exercises them. Without this job the digest's suite only runs on whichever
  # machine happens to type `make check`.
  #
  # Note there is deliberately no `pip install` step anywhere here: the scripts
  # are stdlib-only by contract, so a third-party import creeping in shows up as
  # a ModuleNotFoundError rather than passing silently on a pre-populated runner.
  skill-scripts:
    name: skill scripts (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest supported, plus the two in between that the suite
        # has actually been run against. 3.9 is the floor: it is what macOS
        # ships as /usr/bin/python3, and nothing older has ever been tested.
        python: ['3.9', '3.10', '3.13', '3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Unit tests
        run: python -m unittest discover -s skill/scripts/tests -v

  lint-security:
    name: lint + security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned to match the prek hook (.pre-commit-config.yaml). Bump both
          # together; `latest` here would silently drift from local.
          version: v2.12.2

      - name: gosec (Go SAST)
        # Exclude set MUST match .golangci.yml gosec.excludes + the Makefile
        # (see .golangci.yml for the per-rule false-positive rationale).
        run: go run github.com/securego/gosec/v2/cmd/gosec@latest -quiet -exclude=G104,G204,G304,G704 ./...

      - name: govulncheck (known CVEs)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      # The bootstrap must stay bash — it runs before anything is installed and
      # cannot assume an interpreter — so it needs its own linter. Run once here
      # rather than per-Python-version in the skill-scripts matrix.
      - name: shellcheck (skill bootstrap)
        run: shellcheck skill/scripts/ensure-installed.sh
